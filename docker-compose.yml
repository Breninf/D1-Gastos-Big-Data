services:
  postgres:
    image: postgres:17
    container_name: desafio-camara-postgres

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}


    ports:
      - "${POSTGRES_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Esta linha abaixo cria as tabelas automaticamente na primeira inicialização:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  postgres_data: